[project]
name = "pickandroll"
version = "0.1.0"
description = "Fantasy basketball draft optimizer: pick, then roll the horizon and re-solve."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pulp>=2.9",
  "highspy>=1.7",
  "pydantic>=2.7",
  "xlrd>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
yahoo = ["yfpy>=16"]
bbm = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pickandroll"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
